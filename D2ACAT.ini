[Settings]
; 1 = Free Race offers every unlocked vehicle class in every mode/track. 0 = off.
Enabled=1

; Some mode/track pairs normally show no class list at all. 0 leaves those
; untouched (safer); 1 fills them with every class too.
ExpandEmptyLists=0

; 1 = write each class list the game builds to D2ACAT.log
; (useful if something goes wrong).
LogClassLists=0
